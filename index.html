<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canlı Yayın</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }
        #player-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            max-height: 100vh;
            background: #000;
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 13px;
            background: rgba(0,0,0,0.85);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #222;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #status.loading { color: #ffa500; }
        #status.playing { color: #00ff88; }
        #status.error { color: #ff4444; }
        #status.reconnecting { color: #ffaa00; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .top-bar span {
            color: #aaa;
            font-size: 11px;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .reconnect-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
            display: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .reconnect-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .reconnect-btn.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="player-container">
            <video id="player" playsinline></video>
            
            <div class="top-bar">
                <span>📺 CANLI YAYIN</span>
                <span>⚡ HD</span>
            </div>
            
            <div id="status">⏳ Bağlanıyor...</div>
            <button class="reconnect-btn" id="reconnectBtn">🔄 Yeniden Bağlan</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <script>
        (function() {
            const video = document.getElementById('player');
            const statusEl = document.getElementById('status');
            const reconnectBtn = document.getElementById('reconnectBtn');
            
            // ===== YAYIN LİNKİ =====
            const YAYIN_URL = 'https://tzy.zirvedesin236.cfd/taraftarium/mono.m3u8';
            
            let hls = null;
            let retryCount = 0;
            const MAX_RETRIES = 10;
            let isDestroyed = false;
            let reconnectTimer = null;
            let isReconnecting = false;
            
            function setStatus(text, type = 'loading') {
                statusEl.textContent = text;
                statusEl.className = type;
            }
            
            function showReconnectButton(show = true) {
                if (show) {
                    reconnectBtn.classList.add('show');
                } else {
                    reconnectBtn.classList.remove('show');
                }
            }
            
            function destroyPlayer() {
                isDestroyed = true;
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                if (hls) {
                    try {
                        hls.destroy();
                    } catch(e) {}
                    hls = null;
                }
                try {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                } catch(e) {}
                isReconnecting = false;
            }
            
            function attemptReconnect() {
                if (isDestroyed) return;
                if (isReconnecting) return;
                
                isReconnecting = true;
                retryCount++;
                setStatus(`🔄 Yeniden bağlanılıyor (${retryCount}/${MAX_RETRIES})...`, 'reconnecting');
                showReconnectButton(false);
                
                destroyPlayer();
                
                setTimeout(() => {
                    isDestroyed = false;
                    isReconnecting = false;
                    if (retryCount <= MAX_RETRIES) {
                        initPlayer();
                    } else {
                        setStatus('❌ Bağlantı sağlanamadı', 'error');
                        showReconnectButton(true);
                    }
                }, 2000 * Math.min(retryCount, 5));
            }
            
            function initPlayer() {
                if (isDestroyed) return;
                
                setStatus('⏳ Yayın bağlanıyor...', 'loading');
                showReconnectButton(false);
                
                if (!Hls.isSupported()) {
                    // Safari native HLS
                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = YAYIN_URL;
                        video.addEventListener('loadedmetadata', function onLoad() {
                            setStatus('▶️ Canlı Yayın', 'playing');
                            video.play().catch(() => {});
                            retryCount = 0;
                            showReconnectButton(false);
                            video.removeEventListener('loadedmetadata', onLoad);
                        });
                        video.addEventListener('error', function onError() {
                            setStatus('⚠️ Yükleme hatası', 'error');
                            showReconnectButton(true);
                            video.removeEventListener('error', onError);
                        });
                        return;
                    } else {
                        setStatus('❌ Tarayıcı desteklemiyor', 'error');
                        showReconnectButton(true);
                        return;
                    }
                }
                
                // HLS.js ile
                try {
                    hls = new Hls({
                        enableWorker: false,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 10,
                        enableWebVTT: false,
                        debug: false,
                    });
                    
                    hls.loadSource(YAYIN_URL);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        setStatus('▶️ Canlı Yayın', 'playing');
                        video.play().catch(() => {});
                        retryCount = 0;
                        showReconnectButton(false);
                    });
                    
                    hls.on(Hls.Events.LEVEL_LOADED, () => {
                        setStatus('▶️ Canlı Yayın', 'playing');
                        showReconnectButton(false);
                    });
                    
                    hls.on(Hls.Events.FRAG_LOADING, () => {
                        // Sessizce devam
                    });
                    
                    hls.on(Hls.Events.FRAG_LOADED, () => {
                        if (statusEl.className !== 'playing') {
                            setStatus('▶️ Canlı Yayın', 'playing');
                        }
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            if (retryCount < MAX_RETRIES) {
                                attemptReconnect();
                            } else {
                                setStatus('❌ Bağlantı kesildi', 'error');
                                showReconnectButton(true);
                            }
                        } else {
                            // Non-fatal hata, sessizce devam
                            if (data.type === 'mediaError') {
                                // Buffer problemi, yeniden yükleme dene
                                if (!isReconnecting && retryCount < MAX_RETRIES) {
                                    attemptReconnect();
                                }
                            }
                        }
                    });
                    
                    // Bağlantı koptuğunda otomatik yeniden bağlanma
                    hls.on(Hls.Events.LEVEL_SWITCHING, () => {
                        // Seviye değişiminde sorun yok
                    });
                    
                } catch (e) {
                    setStatus('❌ Başlatma hatası', 'error');
                    showReconnectButton(true);
                }
            }
            
            // Manuel yeniden bağlanma
            reconnectBtn.addEventListener('click', () => {
                retryCount = 0;
                isDestroyed = false;
                isReconnecting = false;
                destroyPlayer();
                setTimeout(() => {
                    isDestroyed = false;
                    initPlayer();
                }, 500);
            });
            
            // Sayfa görünürlük değiştiğinde kontrol et
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    // Sayfaya dönüldü
                    if (video.paused && !video.ended) {
                        video.play().catch(() => {});
                    }
                    // Eğer video donduysa ve 5 saniye içinde ilerleme yoksa yeniden bağlan
                }
            });
            
            // İnternet bağlantısı kontrolü
            window.addEventListener('online', () => {
                if (video.paused || video.readyState < 2) {
                    retryCount = 0;
                    isDestroyed = false;
                    destroyPlayer();
                    setTimeout(() => {
                        isDestroyed = false;
                        initPlayer();
                    }, 1000);
                }
            });
            
            // Başlat
            initPlayer();
            
            // Temizlik
            window.addEventListener('beforeunload', () => {
                destroyPlayer();
            });
            
        })();
    </script>
</body>
</html>
