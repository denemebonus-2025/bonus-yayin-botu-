<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 İZLE AMK BELEŞ</title>
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }

        /* ===== HEADER (Netflix tarzı) ===== */
        .header {
            background: linear-gradient(180deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-right span {
            font-size: 11px;
            color: #555;
            background: rgba(255,255,255,0.04);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .header-right .dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ===== SEARCH (Netflix tarzı) ===== */
        .search-box {
            padding: 12px 20px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 64px;
            z-index: 99;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }
        .search-box input:focus { 
            border-color: #e50914; 
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.1);
        }
        .search-box input::placeholder { color: #555; font-weight: 300; }

        /* ===== SECTION ===== */
        .section-title {
            font-size: 20px;
            font-weight: 600;
            padding: 20px 20px 10px 20px;
            letter-spacing: -0.3px;
        }
        .section-title span { color: #e50914; }

        /* ===== SLIDER (Netflix tarzı) ===== */
        .slider-container {
            padding: 0 16px;
            margin-bottom: 8px;
        }
        .slider {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0 16px 0;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .slider::-webkit-scrollbar { display: none; }
        .slider-item {
            flex: 0 0 140px;
            scroll-snap-align: start;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 14px;
            overflow: hidden;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
        .slider-item:hover { transform: scale(1.03); border-color: rgba(255,255,255,0.1); }
        .slider-item:active { transform: scale(0.94); }
        .slider-item img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }
        .slider-item .info { padding: 10px 12px; }
        .slider-item .title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .slider-item .year {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .slider-item .rating {
            font-size: 11px;
            color: #f5c518;
        }
        .slider-item .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(229, 9, 20, 0.85);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        /* ===== RESULTS ===== */
        .results {
            padding: 8px 16px 20px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .movie-card {
            background: #141414;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
        .movie-card:active { transform: scale(0.94); }
        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #1a1a1a;
        }
        .movie-card .info { padding: 10px 12px; }
        .movie-card .title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card .year {
            font-size: 11px;
            color: #666;
        }
        .movie-card .rating {
            font-size: 11px;
            color: #f5c518;
        }
        .movie-card .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(229, 9, 20, 0.85);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }
        .no-results {
            text-align: center;
            color: #555;
            padding: 50px 20px;
            grid-column: 1 / -1;
            font-size: 15px;
        }
        .result-count {
            color: #555;
            font-size: 13px;
            padding: 0 20px 6px 20px;
        }

        /* ===== DETAIL ===== */
        .detail-page {
            display: none;
            padding: 16px 20px 30px 20px;
            animation: fadeIn 0.35s ease;
        }
        .detail-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .detail-poster {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 16px;
            background: #1a1a1a;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .detail-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .detail-meta { color: #888; font-size: 14px; margin-top: 4px; }
        .detail-overview { color: #aaa; font-size: 14px; margin-top: 12px; line-height: 1.7; }
        .detail-genres { color: #666; font-size: 13px; margin-top: 8px; }
        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }
        .back-btn:active { background: rgba(255,255,255,0.12); }
        .watch-btn {
            background: linear-gradient(135deg, #e50914, #c40812);
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 2;
        }
        .watch-btn:active { opacity: 0.7; }

        /* ===== PLAYER (Netflix tarzı) ===== */
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }
        .player-container.active { display: flex; }
        .player-header {
            padding: 14px 20px;
            background: rgba(17,17,17,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .player-header .title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            padding: 0 8px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .close-btn:active { opacity: 1; }
        .player-selector {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(17,17,17,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .player-selector button {
            padding: 8px 18px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 25px;
            background: transparent;
            color: #666;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }
        .player-selector button:active { transform: scale(0.94); }
        .player-selector button.active {
            border-color: #e50914;
            color: #fff;
            background: rgba(229, 9, 20, 0.12);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.05);
        }
        .player-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .player-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .player-loading {
            position: absolute;
            color: #444;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .player-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #222;
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 600px) {
            .slider-item { flex: 0 0 200px; }
            .slider-item img { height: 270px; }
            .results { grid-template-columns: repeat(3, 1fr); }
            .movie-card img { height: 260px; }
            .detail-poster { max-height: 480px; }
        }
        @media (max-width: 400px) {
            .slider-item { flex: 0 0 120px; }
            .slider-item img { height: 160px; }
            .results { gap: 10px; }
            .movie-card img { height: 160px; }
            .detail-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1>🎬 FilmBot</h1>
        <div class="header-right">
            <span class="dot"></span>
            <span>HD</span>
        </div>
    </div>

    <!-- ===== SEARCH ===== -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Film, dizi veya anime ara..." autofocus>
    </div>

    <!-- ===== HOME ===== -->
    <div id="homePage">
        <div class="section-title">🔥 <span>Popüler</span> Filmler</div>
        <div class="slider-container">
            <div class="slider" id="popularMovies"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>

        <div class="section-title">📺 <span>Popüler</span> Diziler</div>
        <div class="slider-container">
            <div class="slider" id="popularTv"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>

        <div class="section-title">🎌 <span>Popüler</span> Animeler</div>
        <div class="slider-container">
            <div class="slider" id="popularAnime"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>
    </div>

    <!-- ===== RESULTS ===== -->
    <div id="resultCount" class="result-count"></div>
    <div class="results" id="results"></div>

    <!-- ===== DETAIL ===== -->
    <div class="detail-page" id="detailPage">
        <img class="detail-poster" id="detailPoster" src="" alt="">
        <div class="detail-title" id="detailTitle">-</div>
        <div class="detail-meta" id="detailMeta">-</div>
        <div class="detail-genres" id="detailGenres">-</div>
        <div class="detail-overview" id="detailOverview">-</div>
        <div class="detail-actions">
            <button class="back-btn" id="backBtn">← Geri</button>
            <button class="watch-btn" id="watchBtn">▶ İZLE</button>
        </div>
    </div>

    <!-- ===== PLAYER ===== -->
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <span class="title" id="playerTitle">Yükleniyor...</span>
            <button class="close-btn" id="closePlayer">✕</button>
        </div>
        <div class="player-selector" id="playerSelector">
            <button class="active" data-player="vidsrc">VidSrc</button>
            <button data-player="2embed">2Embed</button>
            <button data-player="multiembed">MultiEmbed</button>
        </div>
        <div class="player-body">
            <div class="player-loading" id="playerLoading">
                <div class="spinner"></div>
                <span>⏳ Yükleniyor...</span>
            </div>
            <iframe id="playerIframe" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ===== TMDB =====
        const TMDB_API_KEY = 'af02b5703f3d2d7949f9b1a5fdb4d2a7';
        const TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

        // ===== PLAYER (SADECE ÇALIŞANLAR) =====
        const PLAYERS = {
            vidsrc: { name: 'VidSrc', url: (type, id) => `https://vidsrc.in/embed/${type}/${id}` },
            '2embed': { name: '2Embed', url: (type, id) => `https://www.2embed.to/embed/tmdb/${type}/${id}` },
            multiembed: { name: 'MultiEmbed', url: (type, id) => `https://multiembed.mov/directstream.php?video_id=${id}` }
        };

        // ===== STATE =====
        let currentMovieId = null;
        let currentType = 'movie';
        let currentTitle = '';
        let currentPlayer = 'vidsrc';

        // ===== DOM =====
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultCount = document.getElementById('resultCount');
        const homePage = document.getElementById('homePage');
        const detailPage = document.getElementById('detailPage');
        const detailPoster = document.getElementById('detailPoster');
        const detailTitle = document.getElementById('detailTitle');
        const detailMeta = document.getElementById('detailMeta');
        const detailGenres = document.getElementById('detailGenres');
        const detailOverview = document.getElementById('detailOverview');
        const watchBtn = document.getElementById('watchBtn');
        const backBtn = document.getElementById('backBtn');
        const playerContainer = document.getElementById('playerContainer');
        const playerIframe = document.getElementById('playerIframe');
        const playerTitle = document.getElementById('playerTitle');
        const closePlayer = document.getElementById('closePlayer');
        const playerLoading = document.getElementById('playerLoading');
        const playerSelector = document.getElementById('playerSelector');

        // ===== API =====
        async function tmdbRequest(endpoint, params = {}) {
            params.api_key = TMDB_API_KEY;
            params.language = 'tr-TR';
            const url = `${TMDB_BASE_URL}/${endpoint}?${new URLSearchParams(params)}`;
            try {
                const res = await fetch(url);
                return await res.json();
            } catch { return null; }
        }

        async function getPopularMovies() {
            const data = await tmdbRequest('movie/popular');
            return data?.results || [];
        }

        async function getPopularTv() {
            const data = await tmdbRequest('tv/popular');
            return data?.results || [];
        }

        async function getPopularAnime() {
            const data = await tmdbRequest('discover/tv', { with_genres: '16', sort_by: 'popularity.desc' });
            return data?.results || [];
        }

        async function searchMulti(query) {
            const [movies, tv] = await Promise.all([
                tmdbRequest('search/movie', { query }),
                tmdbRequest('search/tv', { query })
            ]);
            const all = [];
            if (movies?.results) { movies.results.forEach(r => { r._type = 'movie'; }); all.push(...movies.results); }
            if (tv?.results) { tv.results.forEach(r => { r._type = 'tv'; }); all.push(...tv.results); }
            all.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
            return all;
        }

        async function getDetails(type, id) {
            return await tmdbRequest(`${type}/${id}`);
        }

        // ===== RENDER =====
        function renderSlider(containerId, items, type) {
            const container = document.getElementById(containerId);
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="color:#444;padding:10px;">⚠️ Veri yok</div>';
                return;
            }
            let html = '';
            items.slice(0, 15).forEach(item => {
                const title = type === 'movie' ? item.title : item.name;
                const year = type === 'movie' ? (item.release_date || '').slice(0,4) : (item.first_air_date || '').slice(0,4);
                const poster = item.poster_path ? `${TMDB_IMAGE_URL}${item.poster_path}` : '';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
                const id = item.id;
                const itemType = type === 'anime' ? 'tv' : type;
                const badge = type === 'movie' ? '🎬' : type === 'anime' ? '🎌' : '📺';
                html += `
                    <div class="slider-item" onclick="openDetail(${id}, '${itemType}')">
                        ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : `<div style="height:190px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#444;">${badge}</div>`}
                        <div class="badge">${badge}</div>
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="year">${year} ⭐ ${rating}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function showResults(items) {
            homePage.style.display = 'none';
            resultCount.textContent = items.length > 0 ? `${items.length} sonuç bulundu` : '';
            if (items.length === 0) {
                resultsDiv.innerHTML = `<div class="no-results">❌ Sonuç bulunamadı</div>`;
                return;
            }
            let html = '';
            items.slice(0, 30).forEach(item => {
                const title = item._type === 'movie' ? item.title : item.name;
                const year = item._type === 'movie' ? (item.release_date || '').slice(0,4) : (item.first_air_date || '').slice(0,4);
                const poster = item.poster_path ? `${TMDB_IMAGE_URL}${item.poster_path}` : '';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
                const badge = item._type === 'movie' ? '🎬' : '📺';
                html += `
                    <div class="movie-card" onclick="openDetail(${item.id}, '${item._type}')">
                        ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : `<div style="height:190px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#444;">${badge}</div>`}
                        <div class="badge">${badge}</div>
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="year">${year} ⭐ ${rating}</div>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
            detailPage.classList.remove('active');
        }

        // ===== DETAIL =====
        async function openDetail(id, type) {
            currentMovieId = id;
            currentType = type;
            const details = await getDetails(type, id);
            if (!details) return;

            const title = type === 'movie' ? details.title : details.name;
            const year = type === 'movie' ? (details.release_date || '').slice(0,4) : (details.first_air_date || '').slice(0,4);
            const overview = details.overview || 'Açıklama yok.';
            const poster = details.poster_path ? `${TMDB_IMAGE_URL}${details.poster_path}` : '';
            const rating = details.vote_average ? details.vote_average.toFixed(1) : '?';
            const genres = details.genres ? details.genres.map(g => g.name).join(', ') : '';
            currentTitle = title;

            detailPoster.src = poster || '';
            detailPoster.style.display = poster ? 'block' : 'none';
            detailTitle.textContent = `${title} (${year})`;
            detailMeta.textContent = `⭐ ${rating}/10`;
            detailGenres.textContent = genres || 'Tür bilgisi yok';
            detailOverview.textContent = overview;

            resultsDiv.innerHTML = '';
            homePage.style.display = 'none';
            detailPage.classList.add('active');
            window.scrollTo(0, 0);
        }

        // ===== PLAYER =====
        function getPlayerUrl(type, id, playerKey) {
            const player = PLAYERS[playerKey];
            if (!player) return null;
            return player.url(type, id);
        }

        function openPlayer(type, id, title) {
            currentType = type;
            currentMovieId = id;
            currentTitle = title;
            playerTitle.textContent = `▶ ${title}`;
            playerContainer.classList.add('active');
            document.body.style.overflow = 'hidden';
            loadPlayer(currentPlayer);
        }

        function loadPlayer(playerKey) {
            const url = getPlayerUrl(currentType, currentMovieId, playerKey);
            if (!url) return;
            currentPlayer = playerKey;
            document.querySelectorAll('.player-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.player === playerKey);
            });
            playerLoading.style.display = 'flex';
            playerIframe.src = '';
            setTimeout(() => {
                playerIframe.src = url;
                playerLoading.style.display = 'none';
            }, 500);
        }

        function closePlayerFunc() {
            playerContainer.classList.remove('active');
            playerIframe.src = '';
            document.body.style.overflow = '';
        }

        // ===== EVENTS =====
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                homePage.style.display = 'block';
                resultsDiv.innerHTML = '';
                resultCount.textContent = '';
                return;
            }
            searchTimeout = setTimeout(async () => {
                resultsDiv.innerHTML = '<div class="no-results" style="padding:20px;">⏳ Aranıyor...</div>';
                const items = await searchMulti(query);
                showResults(items);
            }, 400);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                const query = searchInput.value.trim();
                if (query.length >= 2) {
                    searchTimeout = setTimeout(async () => {
                        resultsDiv.innerHTML = '<div class="no-results" style="padding:20px;">⏳ Aranıyor...</div>';
                        const items = await searchMulti(query);
                        showResults(items);
                    }, 100);
                }
            }
        });

        backBtn.addEventListener('click', () => {
            detailPage.classList.remove('active');
            homePage.style.display = 'block';
            resultsDiv.innerHTML = '';
            resultCount.textContent = '';
            window.scrollTo(0, 0);
        });

        watchBtn.addEventListener('click', () => {
            if (currentMovieId && currentTitle) {
                openPlayer(currentType, currentMovieId, currentTitle);
            }
        });

        closePlayer.addEventListener('click', closePlayerFunc);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayerFunc(); });

        playerSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const playerKey = btn.dataset.player;
            if (playerKey && playerKey !== currentPlayer) {
                loadPlayer(playerKey);
            }
        });

        // ===== INIT =====
        async function init() {
            try {
                const [movies, tv, anime] = await Promise.all([
                    getPopularMovies(),
                    getPopularTv(),
                    getPopularAnime()
                ]);
                renderSlider('popularMovies', movies, 'movie');
                renderSlider('popularTv', tv, 'tv');
                renderSlider('popularAnime', anime, 'anime');
            } catch (e) {
                console.log('Yükleme hatası:', e);
            }
        }
        init();
        console.log('🎬 FilmBot yüklendi!');
    </script>
</body>
</html>
