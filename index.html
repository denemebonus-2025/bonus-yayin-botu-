<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canlı Yayın</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }
        #player-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            max-height: 100vh;
            background: #000;
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #222;
            text-align: center;
            white-space: nowrap;
            z-index: 10;
        }
        #status.loading { color: #ffa500; }
        #status.playing { color: #00ff88; }
        #status.error { color: #ff4444; }
        #status.ready { color: #4fc3f7; }
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .top-bar span {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .reconnect-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #aaa;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
            display: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .reconnect-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="player-container">
            <video id="player" playsinline></video>
            
            <div class="top-bar">
                <span>📺 CANLI YAYIN</span>
                <span>⚡ HD</span>
            </div>
            
            <div id="status">⏳ Bağlanıyor...</div>
            <button class="reconnect-btn" id="reconnectBtn">🔄 Yeniden Bağlan</button>
        </div>
    </div>

    <!-- GÜNCEL HLS.JS KÜTÜPHANESİ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <script>
        (function() {
            const video = document.getElementById('player');
            const statusEl = document.getElementById('status');
            const reconnectBtn = document.getElementById('reconnectBtn');
            
            // ===== YAYIN LİNKİ (GÜNCEL) =====
            const YAYIN_URL = 'https://tzy.zirvedesin236.cfd/taraftarium/mono.m3u8';
            
            let hls = null;
            let retryCount = 0;
            const MAX_RETRIES = 5;
            
            function setStatus(text, type = 'loading') {
                statusEl.textContent = text;
                statusEl.className = type;
            }
            
            function showReconnectButton(show = true) {
                reconnectBtn.style.display = show ? 'block' : 'none';
            }
            
            function destroyPlayer() {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                video.pause();
                video.removeAttribute('src');
                video.load();
            }
            
            function initPlayer() {
                destroyPlayer();
                setStatus('⏳ Yayın bağlanıyor...', 'loading');
                showReconnectButton(false);
                
                // 1. HLS.js ile dene
                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: false,
                        lowLatencyMode: true,
                        maxBufferLength: 10,
                        maxMaxBufferLength: 20,
                        debug: false,
                    });
                    
                    hls.loadSource(YAYIN_URL);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        setStatus('▶️ Canlı Yayın', 'playing');
                        video.play().catch(() => {});
                        retryCount = 0;
                        showReconnectButton(false);
                    });
                    
                    hls.on(Hls.Events.LEVEL_LOADED, () => {
                        setStatus('▶️ Canlı Yayın', 'playing');
                        showReconnectButton(false);
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            setStatus('⚠️ Bağlantı kesildi, yeniden deneniyor...', 'error');
                            showReconnectButton(true);
                            
                            if (retryCount < MAX_RETRIES) {
                                retryCount++;
                                setTimeout(() => {
                                    initPlayer();
                                }, 3000 * retryCount);
                            } else {
                                setStatus('❌ Yayın ulaşılamıyor', 'error');
                                showReconnectButton(true);
                            }
                        }
                    });
                    
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // 2. Safari / iOS için native HLS
                    video.src = YAYIN_URL;
                    video.addEventListener('loadedmetadata', () => {
                        setStatus('▶️ Canlı Yayın', 'playing');
                        video.play().catch(() => {});
                        retryCount = 0;
                        showReconnectButton(false);
                    });
                    video.addEventListener('error', () => {
                        setStatus('⚠️ Safari yükleme hatası', 'error');
                        showReconnectButton(true);
                    });
                    
                } else {
                    // 3. Hiçbiri desteklemiyor
                    setStatus('❌ Tarayıcı desteklemiyor', 'error');
                    showReconnectButton(true);
                }
            }
            
            // Manuel yeniden bağlanma
            reconnectBtn.addEventListener('click', () => {
                retryCount = 0;
                initPlayer();
            });
            
            // Başlat
            initPlayer();
            
            // Sayfa görünürlük değiştiğinde yeniden bağlan (performans için)
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !video.paused) {
                    if (video.readyState < 2) {
                        retryCount = 0;
                        initPlayer();
                    }
                }
            });
            
            // Hata yakalama
            window.addEventListener('error', (e) => {
                if (e.message && e.message.includes('Hls')) {
                    setStatus('⚠️ Kütüphane hatası, yeniden deneniyor...', 'error');
                    setTimeout(initPlayer, 2000);
                }
            });
            
        })();
    </script>
</body>
</html>
