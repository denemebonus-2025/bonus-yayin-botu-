<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 FilmBot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 20px; color: #e50914; }
        .header span { font-size: 12px; color: #666; }
        .search-box {
            padding: 12px 16px;
            background: #111;
            position: sticky;
            top: 60px;
            z-index: 99;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 25px;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box input:focus { border-color: #e50914; }
        .search-box input::placeholder { color: #666; }
        .results {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .movie-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #222;
        }
        .movie-card:active { transform: scale(0.95); }
        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #222;
        }
        .movie-card .info { padding: 8px 10px; }
        .movie-card .title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card .year {
            font-size: 11px;
            color: #888;
        }
        .movie-card .rating {
            font-size: 11px;
            color: #f5c518;
        }
        .no-results {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }
        .loading-text {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }
        /* ===== DETAY SAYFASI ===== */
        .detail-page {
            display: none;
            padding: 16px;
        }
        .detail-page.active { display: block; }
        .detail-poster {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .detail-title { font-size: 22px; font-weight: 700; }
        .detail-meta { color: #888; font-size: 14px; margin-top: 4px; }
        .detail-overview { color: #aaa; font-size: 14px; margin-top: 8px; line-height: 1.5; }
        .detail-genres { color: #888; font-size: 13px; margin-top: 6px; }
        .watch-btn {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .watch-btn:active { opacity: 0.7; }
        .back-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        /* ===== PLAYER ===== */
        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        .player-container.active { display: flex; }
        .player-header {
            padding: 12px 16px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .player-header .title { 
            font-size: 14px; 
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }
        .player-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .player-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .player-loading {
            position: absolute;
            color: #666;
            font-size: 14px;
        }
        .player-error {
            position: absolute;
            color: #ff4444;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        /* ===== PLAYER SEÇİCİ ===== */
        .player-selector {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #111;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .player-selector button {
            padding: 6px 14px;
            border: 2px solid #333;
            border-radius: 20px;
            background: transparent;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .player-selector button.active {
            border-color: #e50914;
            color: #fff;
            background: rgba(229, 9, 20, 0.2);
        }
        .player-selector button:active { transform: scale(0.95); }
        @media (min-width: 600px) {
            .results { grid-template-columns: repeat(3, 1fr); }
            .detail-poster { max-height: 400px; }
        }
        @media (max-width: 400px) {
            .results { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .movie-card img { height: 140px; }
        }
        /* ===== Sonuç sayısı ===== */
        .result-count {
            color: #666;
            font-size: 12px;
            padding: 0 16px 8px 16px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🎬 FilmBot</h1>
        <span>📱 Mini App</span>
    </div>

    <!-- ARAMA -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Film veya dizi ara..." autofocus>
    </div>

    <!-- SONUÇLAR -->
    <div id="resultCount" class="result-count"></div>
    <div class="results" id="results">
        <div class="no-results">🔍 Film veya dizi aramak için yazın</div>
    </div>

    <!-- DETAY SAYFASI -->
    <div class="detail-page" id="detailPage">
        <button class="back-btn" id="backBtn">⬅️ Geri</button>
        <img class="detail-poster" id="detailPoster" src="" alt="">
        <div class="detail-title" id="detailTitle">-</div>
        <div class="detail-meta" id="detailMeta">-</div>
        <div class="detail-genres" id="detailGenres">-</div>
        <div class="detail-overview" id="detailOverview">-</div>
        <button class="watch-btn" id="watchBtn">▶️ İZLE</button>
    </div>

    <!-- PLAYER -->
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <span class="title" id="playerTitle">Yükleniyor...</span>
            <button class="close-btn" id="closePlayer">✕</button>
        </div>
        <div class="player-selector" id="playerSelector">
            <button class="active" data-player="vidsrc">VidSrc</button>
            <button data-player="2embed">2Embed</button>
            <button data-player="multiembed">MultiEmbed</button>
            <button data-player="embedplus">EmbedPlus</button>
            <button data-player="gogo">Gogo</button>
        </div>
        <div class="player-body">
            <div class="player-loading" id="playerLoading">⏳ Yükleniyor...</div>
            <div class="player-error" id="playerError" style="display:none;">❌ Bu player çalışmıyor, başka birini dene</div>
            <iframe id="playerIframe" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ===== KONFIG =====
        const TMDB_API_KEY = 'af02b5703f3d2d7949f9b1a5fdb4d2a7';
        const TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

        // ===== PLAYER LİSTESİ =====
        const PLAYERS = {
            vidsrc: {
                name: 'VidSrc',
                url: (type, id) => `https://vidsrc.to/embed/${type}/${id}`
            },
            '2embed': {
                name: '2Embed',
                url: (type, id) => `https://www.2embed.to/embed/tmdb/${type}/${id}`
            },
            multiembed: {
                name: 'MultiEmbed',
                url: (type, id) => `https://multiembed.mov/?video_id=${id}`
            },
            embedplus: {
                name: 'EmbedPlus',
                url: (type, id) => `https://www.embedplus.com/embed.php?id=${id}`
            },
            gogo: {
                name: 'Gogo',
                url: (type, id) => `https://gogoanime.ee/embed/${type}?id=${id}`
            }
        };

        // ===== STATE =====
        let currentMovieId = null;
        let currentType = 'movie';
        let currentTitle = '';
        let currentPlayer = 'vidsrc';

        // ===== DOM =====
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultCount = document.getElementById('resultCount');
        const detailPage = document.getElementById('detailPage');
        const detailPoster = document.getElementById('detailPoster');
        const detailTitle = document.getElementById('detailTitle');
        const detailMeta = document.getElementById('detailMeta');
        const detailGenres = document.getElementById('detailGenres');
        const detailOverview = document.getElementById('detailOverview');
        const watchBtn = document.getElementById('watchBtn');
        const backBtn = document.getElementById('backBtn');
        const playerContainer = document.getElementById('playerContainer');
        const playerIframe = document.getElementById('playerIframe');
        const playerTitle = document.getElementById('playerTitle');
        const closePlayer = document.getElementById('closePlayer');
        const playerLoading = document.getElementById('playerLoading');
        const playerError = document.getElementById('playerError');
        const playerSelector = document.getElementById('playerSelector');

        // ===== TMDB API =====
        async function tmdbRequest(endpoint, params = {}) {
            params.api_key = TMDB_API_KEY;
            params.language = 'tr-TR';
            const url = `${TMDB_BASE_URL}/${endpoint}?${new URLSearchParams(params)}`;
            try {
                const res = await fetch(url);
                return await res.json();
            } catch { return null; }
        }

        async function searchMulti(query) {
            const [movies, tv] = await Promise.all([
                tmdbRequest('search/movie', { query }),
                tmdbRequest('search/tv', { query })
            ]);
            const all = [];
            if (movies?.results) {
                movies.results.forEach(r => { r._type = 'movie'; });
                all.push(...movies.results);
            }
            if (tv?.results) {
                tv.results.forEach(r => { r._type = 'tv'; });
                all.push(...tv.results);
            }
            all.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
            return all;
        }

        async function getDetails(type, id) {
            return await tmdbRequest(`${type}/${id}`);
        }

        // ===== UI =====
        function showResults(items) {
            resultCount.textContent = items.length > 0 ? `${items.length} sonuç bulundu` : '';
            
            if (items.length === 0) {
                resultsDiv.innerHTML = `<div class="no-results">❌ Sonuç bulunamadı</div>`;
                return;
            }

            let html = '';
            items.slice(0, 30).forEach(item => {
                const title = item._type === 'movie' ? item.title : item.name;
                const year = item._type === 'movie' ? (item.release_date || '').slice(0,4) : (item.first_air_date || '').slice(0,4);
                const poster = item.poster_path ? `${TMDB_IMAGE_URL}${item.poster_path}` : '';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
                const typeIcon = item._type === 'movie' ? '🎬' : '📺';

                html += `
                    <div class="movie-card" onclick="openDetail(${item.id}, '${item._type}')">
                        ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : `<div style="height:180px;background:#222;display:flex;align-items:center;justify-content:center;color:#666;">${typeIcon}</div>`}
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="year">${year} ⭐ ${rating}</div>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
            detailPage.classList.remove('active');
        }

        async function openDetail(id, type) {
            currentMovieId = id;
            currentType = type;

            const details = await getDetails(type, id);
            if (!details) return;

            const title = type === 'movie' ? details.title : details.name;
            const year = type === 'movie' ? (details.release_date || '').slice(0,4) : (details.first_air_date || '').slice(0,4);
            const overview = details.overview || 'Açıklama yok.';
            const poster = details.poster_path ? `${TMDB_IMAGE_URL}${details.poster_path}` : '';
            const rating = details.vote_average ? details.vote_average.toFixed(1) : '?';
            const genres = details.genres ? details.genres.map(g => g.name).join(', ') : '';

            currentTitle = title;

            detailPoster.src = poster || '';
            detailPoster.style.display = poster ? 'block' : 'none';
            detailTitle.textContent = `${title} (${year})`;
            detailMeta.textContent = `⭐ ${rating}/10`;
            detailGenres.textContent = genres || 'Tür bilgisi yok';
            detailOverview.textContent = overview;

            resultsDiv.innerHTML = '';
            detailPage.classList.add('active');
            window.scrollTo(0, 0);
        }

        // ===== PLAYER =====
        function getPlayerUrl(type, id, playerKey) {
            const player = PLAYERS[playerKey];
            if (!player) return null;
            return player.url(type, id);
        }

        function openPlayer(type, id, title) {
            currentType = type;
            currentMovieId = id;
            currentTitle = title;

            playerTitle.textContent = `▶️ ${title}`;
            playerContainer.classList.add('active');
            document.body.style.overflow = 'hidden';

            // İlk player'ı yükle
            loadPlayer(currentPlayer);
        }

        function loadPlayer(playerKey) {
            const url = getPlayerUrl(currentType, currentMovieId, playerKey);
            if (!url) return;

            currentPlayer = playerKey;

            // Butonları güncelle
            document.querySelectorAll('.player-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.player === playerKey);
            });

            playerLoading.style.display = 'block';
            playerError.style.display = 'none';
            playerIframe.src = '';

            // Timeout ile yükle
            setTimeout(() => {
                playerIframe.src = url;
                playerLoading.style.display = 'none';
            }, 300);

            // Hata kontrolü
            setTimeout(() => {
                // Iframe yüklenmediyse hata göster
            }, 8000);
        }

        function closePlayerFunc() {
            playerContainer.classList.remove('active');
            playerIframe.src = '';
            document.body.style.overflow = '';
        }

        // ===== EVENT LISTENER'LAR =====
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                resultsDiv.innerHTML = '<div class="no-results">🔍 En az 2 karakter girin</div>';
                resultCount.textContent = '';
                return;
            }
            searchTimeout = setTimeout(async () => {
                resultsDiv.innerHTML = '<div class="loading-text">⏳ Aranıyor...</div>';
                const items = await searchMulti(query);
                showResults(items);
            }, 400);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                const query = searchInput.value.trim();
                if (query.length >= 2) {
                    searchTimeout = setTimeout(async () => {
                        resultsDiv.innerHTML = '<div class="loading-text">⏳ Aranıyor...</div>';
                        const items = await searchMulti(query);
                        showResults(items);
                    }, 100);
                }
            }
        });

        backBtn.addEventListener('click', () => {
            detailPage.classList.remove('active');
            resultsDiv.innerHTML = '<div class="no-results">🔍 Film veya dizi aramak için yazın</div>';
            resultCount.textContent = '';
        });

        watchBtn.addEventListener('click', () => {
            if (currentMovieId && currentTitle) {
                openPlayer(currentType, currentMovieId, currentTitle);
            }
        });

        closePlayer.addEventListener('click', closePlayerFunc);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePlayerFunc();
        });

        // Player selector
        playerSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const playerKey = btn.dataset.player;
            if (playerKey && playerKey !== currentPlayer) {
                loadPlayer(playerKey);
            }
        });

        // ===== BAŞLAT =====
        console.log('🎬 FilmBot Mini App yüklendi!');
        console.log('📺 Playerlar:', Object.keys(PLAYERS).join(', '));
    </script>
</body>
</html>
