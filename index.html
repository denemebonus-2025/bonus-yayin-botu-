<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 FilmBot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }

        .header {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #e50914, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header span { font-size: 11px; color: #555; }

        .search-box {
            padding: 12px 16px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 60px;
            z-index: 99;
        }
        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 25px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus { border-color: #e50914; background: rgba(255,255,255,0.08); }
        .search-box input::placeholder { color: #555; }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            padding: 16px 16px 8px 16px;
        }
        .section-title span { color: #e50914; }

        .slider-container { padding: 0 16px; margin-bottom: 12px; }
        .slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0 16px 0;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .slider::-webkit-scrollbar { display: none; }
        .slider-item {
            flex: 0 0 130px;
            scroll-snap-align: start;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 12px;
            overflow: hidden;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .slider-item:active { transform: scale(0.94); }
        .slider-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .slider-item .info { padding: 8px 10px; }
        .slider-item .title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .slider-item .year { font-size: 10px; color: #666; }
        .slider-item .rating { font-size: 10px; color: #f5c518; }

        .results {
            padding: 8px 16px 20px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .movie-card {
            background: #141414;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .movie-card:active { transform: scale(0.94); }
        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a1a1a;
        }
        .movie-card .info { padding: 8px 10px; }
        .movie-card .title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card .year { font-size: 11px; color: #666; }
        .movie-card .rating { font-size: 11px; color: #f5c518; }
        .no-results {
            text-align: center;
            color: #555;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }
        .result-count {
            color: #555;
            font-size: 12px;
            padding: 0 16px 4px 16px;
        }

        .detail-page {
            display: none;
            padding: 16px 16px 30px 16px;
            animation: fadeIn 0.3s;
        }
        .detail-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .detail-poster {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 14px;
            background: #1a1a1a;
        }
        .detail-title { font-size: 24px; font-weight: 700; }
        .detail-meta { color: #888; font-size: 14px; margin-top: 4px; }
        .detail-overview { color: #aaa; font-size: 14px; margin-top: 10px; line-height: 1.6; }
        .detail-genres { color: #666; font-size: 13px; margin-top: 6px; }
        .back-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background 0.2s;
        }
        .back-btn:active { background: rgba(255,255,255,0.12); }
        .watch-btn {
            background: linear-gradient(135deg, #e50914, #c40812);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .watch-btn:active { opacity: 0.7; }

        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }
        .player-container.active { display: flex; }
        .player-header {
            padding: 12px 16px;
            background: rgba(17,17,17,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .player-header .title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
            opacity: 0.7;
        }
        .close-btn:active { opacity: 1; }
        .player-selector {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(17,17,17,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .player-selector button {
            padding: 6px 14px;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            background: transparent;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .player-selector button:active { transform: scale(0.94); }
        .player-selector button.active {
            border-color: #e50914;
            color: #fff;
            background: rgba(229, 9, 20, 0.15);
        }

        .player-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            padding: 0;
        }
        .player-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .player-loading {
            position: absolute;
            color: #555;
            font-size: 14px;
            z-index: 5;
        }
        .player-error {
            position: absolute;
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            padding: 20px;
            display: none;
            z-index: 5;
        }
        .player-source-info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.2);
            font-size: 10px;
            z-index: 5;
            pointer-events: none;
        }

        @media (min-width: 600px) {
            .slider-item { flex: 0 0 180px; }
            .slider-item img { height: 250px; }
            .results { grid-template-columns: repeat(3, 1fr); }
            .movie-card img { height: 240px; }
            .detail-poster { max-height: 450px; }
        }
        @media (max-width: 400px) {
            .slider-item { flex: 0 0 110px; }
            .slider-item img { height: 150px; }
            .results { gap: 8px; }
            .movie-card img { height: 150px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 FilmBot</h1>
        <span>📱 Mini App</span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Film, dizi veya anime ara..." autofocus>
    </div>

    <div id="homePage">
        <div class="section-title">🔥 <span>Popüler</span> Filmler</div>
        <div class="slider-container">
            <div class="slider" id="popularMovies"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>
        <div class="section-title">📺 <span>Popüler</span> Diziler</div>
        <div class="slider-container">
            <div class="slider" id="popularTv"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>
        <div class="section-title">🎌 <span>Popüler</span> Animeler</div>
        <div class="slider-container">
            <div class="slider" id="popularAnime"><div class="no-results" style="padding:10px;">⏳ Yükleniyor...</div></div>
        </div>
    </div>

    <div id="resultCount" class="result-count"></div>
    <div class="results" id="results"></div>

    <div class="detail-page" id="detailPage">
        <button class="back-btn" id="backBtn">← Geri</button>
        <img class="detail-poster" id="detailPoster" src="" alt="">
        <div class="detail-title" id="detailTitle">-</div>
        <div class="detail-meta" id="detailMeta">-</div>
        <div class="detail-genres" id="detailGenres">-</div>
        <div class="detail-overview" id="detailOverview">-</div>
        <button class="watch-btn" id="watchBtn">▶ İZLE</button>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <span class="title" id="playerTitle">Yükleniyor...</span>
            <button class="close-btn" id="closePlayer">✕</button>
        </div>
        <div class="player-selector" id="playerSelector">
            <button class="active" data-player="vidsrc">VidSrc</button>
            <button data-player="2embed">2Embed</button>
            <button data-player="multiembed">MultiEmbed</button>
            <button data-player="vidsrc_in">VidSrc.in</button>
        </div>
        <div class="player-body">
            <div class="player-loading" id="playerLoading">⏳ Yükleniyor...</div>
            <div class="player-error" id="playerError">❌ Bu player çalışmıyor, başka birini dene</div>
            <iframe id="playerIframe" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
            <div class="player-source-info" id="sourceInfo"></div>
        </div>
    </div>

    <script>
        // =====================================================
        // TMDB API
        // =====================================================
        const TMDB_API_KEY = 'af02b5703f3d2d7949f9b1a5fdb4d2a7';
        const TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

        // =====================================================
        // PLAYER LİSTESİ
        // =====================================================
        const PLAYERS = {
            'vidsrc': { name: 'VidSrc', url: (type, id) => `https://vidsrc.to/embed/${type}/${id}` },
            '2embed': { name: '2Embed', url: (type, id) => `https://www.2embed.to/embed/tmdb/${type}/${id}` },
            'multiembed': { name: 'MultiEmbed', url: (type, id) => `https://multiembed.mov/directstream.php?video_id=${id}` },
            'vidsrc_in': { name: 'VidSrc.in', url: (type, id) => `https://vidsrc.in/embed/${type}/${id}` }
        };

        // =====================================================
        // STATE & DOM
        // =====================================================
        let currentMovieId = null;
        let currentType = 'movie';
        let currentTitle = '';
        let currentPlayer = 'vidsrc';
        let currentUrl = '';

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultCount = document.getElementById('resultCount');
        const homePage = document.getElementById('homePage');
        const detailPage = document.getElementById('detailPage');
        const detailPoster = document.getElementById('detailPoster');
        const detailTitle = document.getElementById('detailTitle');
        const detailMeta = document.getElementById('detailMeta');
        const detailGenres = document.getElementById('detailGenres');
        const detailOverview = document.getElementById('detailOverview');
        const watchBtn = document.getElementById('watchBtn');
        const backBtn = document.getElementById('backBtn');
        const playerContainer = document.getElementById('playerContainer');
        const playerTitle = document.getElementById('playerTitle');
        const closePlayer = document.getElementById('closePlayer');
        const playerLoading = document.getElementById('playerLoading');
        const playerError = document.getElementById('playerError');
        const playerSelector = document.getElementById('playerSelector');
        const sourceInfo = document.getElementById('sourceInfo');
        const playerIframe = document.getElementById('playerIframe');

        // =====================================================
        // API
        // =====================================================
        async function tmdbRequest(endpoint, params = {}) {
            params.api_key = TMDB_API_KEY;
            params.language = 'tr-TR';
            const url = `${TMDB_BASE_URL}/${endpoint}?${new URLSearchParams(params)}`;
            try {
                const res = await fetch(url);
                return await res.json();
            } catch { return null; }
        }

        async function getPopularMovies() {
            const data = await tmdbRequest('movie/popular');
            return data?.results || [];
        }

        async function getPopularTv() {
            const data = await tmdbRequest('tv/popular');
            return data?.results || [];
        }

        async function getPopularAnime() {
            const data = await tmdbRequest('discover/tv', { with_genres: '16', sort_by: 'popularity.desc' });
            return data?.results || [];
        }

        async function searchMulti(query) {
            const [movies, tv] = await Promise.all([
                tmdbRequest('search/movie', { query }),
                tmdbRequest('search/tv', { query })
            ]);
            const all = [];
            if (movies?.results) { movies.results.forEach(r => { r._type = 'movie'; }); all.push(...movies.results); }
            if (tv?.results) { tv.results.forEach(r => { r._type = 'tv'; }); all.push(...tv.results); }
            all.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
            return all;
        }

        async function getDetails(type, id) {
            return await tmdbRequest(`${type}/${id}`);
        }

        // =====================================================
        // PLAYER KONTROL
        // =====================================================
        function showPlayerError(msg) {
            playerLoading.style.display = 'none';
            playerError.textContent = msg;
            playerError.style.display = 'block';
            playerIframe.src = '';
            sourceInfo.textContent = '❌ Hata';
        }

        function loadPlayer(playerKey) {
            const player = PLAYERS[playerKey];
            if (!player || !player.url) {
                showPlayerError('❌ Player bulunamadı!');
                return;
            }

            currentPlayer = playerKey;
            const url = typeof player.url === 'function' ? player.url(currentType, currentMovieId) : player.url;
            if (!url) {
                showPlayerError('❌ URL alınamadı!');
                return;
            }

            currentUrl = url;
            document.querySelectorAll('.player-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.player === playerKey);
            });

            playerLoading.style.display = 'block';
            playerError.style.display = 'none';
            playerIframe.src = '';
            sourceInfo.textContent = `📡 ${player.name} yükleniyor...`;

            setTimeout(() => {
                playerIframe.src = url;
                playerLoading.style.display = 'none';
                sourceInfo.textContent = `▶️ ${player.name}`;
            }, 500);

            // Iframe yüklenmezse hata göster
            setTimeout(() => {
                try {
                    if (!playerIframe.contentDocument || !playerIframe.contentDocument.body.innerHTML) {
                        // Sessizce bekle, bazen yavaş yüklenir
                    }
                } catch (e) {
                    // CORS hatası normal, devam et
                }
            }, 8000);
        }

        function openPlayer(type, id, title) {
            currentType = type;
            currentMovieId = id;
            currentTitle = title;
            playerTitle.textContent = `▶ ${title}`;
            playerContainer.classList.add('active');
            document.body.style.overflow = 'hidden';
            playerIframe.src = '';
            loadPlayer(currentPlayer);
        }

        function closePlayerFunc() {
            playerIframe.src = '';
            playerContainer.classList.remove('active');
            document.body.style.overflow = '';
        }

        // =====================================================
        // RENDER
        // =====================================================
        function renderSlider(containerId, items, type) {
            const container = document.getElementById(containerId);
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="color:#444;padding:10px;">⚠️ Veri yok</div>';
                return;
            }
            let html = '';
            items.slice(0, 15).forEach(item => {
                const title = type === 'movie' ? item.title : item.name;
                const year = type === 'movie' ? (item.release_date || '').slice(0,4) : (item.first_air_date || '').slice(0,4);
                const poster = item.poster_path ? `${TMDB_IMAGE_URL}${item.poster_path}` : '';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
                const id = item.id;
                const itemType = type === 'anime' ? 'tv' : type;
                html += `
                    <div class="slider-item" onclick="openDetail(${id}, '${itemType}')">
                        ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : `<div style="height:180px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#444;">${type === 'movie' ? '🎬' : '📺'}</div>`}
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="year">${year} ⭐ ${rating}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function showResults(items) {
            homePage.style.display = 'none';
            resultCount.textContent = items.length > 0 ? `${items.length} sonuç bulundu` : '';
            if (items.length === 0) {
                resultsDiv.innerHTML = `<div class="no-results">❌ Sonuç bulunamadı</div>`;
                return;
            }
            let html = '';
            items.slice(0, 30).forEach(item => {
                const title = item._type === 'movie' ? item.title : item.name;
                const year = item._type === 'movie' ? (item.release_date || '').slice(0,4) : (item.first_air_date || '').slice(0,4);
                const poster = item.poster_path ? `${TMDB_IMAGE_URL}${item.poster_path}` : '';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
                const typeIcon = item._type === 'movie' ? '🎬' : '📺';
                html += `
                    <div class="movie-card" onclick="openDetail(${item.id}, '${item._type}')">
                        ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'">` : `<div style="height:180px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#444;">${typeIcon}</div>`}
                        <div class="info">
                            <div class="title">${title}</div>
                            <div class="year">${year} ⭐ ${rating}</div>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
            detailPage.classList.remove('active');
        }

        // =====================================================
        // DETAY
        // =====================================================
        async function openDetail(id, type) {
            currentMovieId = id;
            currentType = type;
            const details = await getDetails(type, id);
            if (!details) return;

            const title = type === 'movie' ? details.title : details.name;
            const year = type === 'movie' ? (details.release_date || '').slice(0,4) : (details.first_air_date || '').slice(0,4);
            const overview = details.overview || 'Açıklama yok.';
            const poster = details.poster_path ? `${TMDB_IMAGE_URL}${details.poster_path}` : '';
            const rating = details.vote_average ? details.vote_average.toFixed(1) : '?';
            const genres = details.genres ? details.genres.map(g => g.name).join(', ') : '';
            currentTitle = title;

            detailPoster.src = poster || '';
            detailPoster.style.display = poster ? 'block' : 'none';
            detailTitle.textContent = `${title} (${year})`;
            detailMeta.textContent = `⭐ ${rating}/10`;
            detailGenres.textContent = genres || 'Tür bilgisi yok';
            detailOverview.textContent = overview;

            resultsDiv.innerHTML = '';
            homePage.style.display = 'none';
            detailPage.classList.add('active');
            window.scrollTo(0, 0);
        }

        // =====================================================
        // EVENT LISTENER'LAR
        // =====================================================
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                homePage.style.display = 'block';
                resultsDiv.innerHTML = '';
                resultCount.textContent = '';
                return;
            }
            searchTimeout = setTimeout(async () => {
                resultsDiv.innerHTML = '<div class="no-results" style="padding:20px;">⏳ Aranıyor...</div>';
                const items = await searchMulti(query);
                showResults(items);
            }, 400);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                const query = searchInput.value.trim();
                if (query.length >= 2) {
                    searchTimeout = setTimeout(async () => {
                        resultsDiv.innerHTML = '<div class="no-results" style="padding:20px;">⏳ Aranıyor...</div>';
                        const items = await searchMulti(query);
                        showResults(items);
                    }, 100);
                }
            }
        });

        backBtn.addEventListener('click', () => {
            detailPage.classList.remove('active');
            homePage.style.display = 'block';
            resultsDiv.innerHTML = '';
            resultCount.textContent = '';
            window.scrollTo(0, 0);
        });

        watchBtn.addEventListener('click', () => {
            if (currentMovieId && currentTitle) {
                openPlayer(currentType, currentMovieId, currentTitle);
            }
        });

        closePlayer.addEventListener('click', closePlayerFunc);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayerFunc(); });

        playerSelector.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const playerKey = btn.dataset.player;
            if (playerKey && playerKey !== currentPlayer) {
                loadPlayer(playerKey);
            }
        });

        // =====================================================
        // BAŞLAT
        // =====================================================
        async function init() {
            try {
                const [movies, tv, anime] = await Promise.all([
                    getPopularMovies(),
                    getPopularTv(),
                    getPopularAnime()
                ]);
                renderSlider('popularMovies', movies, 'movie');
                renderSlider('popularTv', tv, 'tv');
                renderSlider('popularAnime', anime, 'anime');
            } catch (e) {
                console.log('Yükleme hatası:', e);
            }
            console.log('🎬 FilmBot yüklendi!');
        }
        init();
    </script>
</body>
